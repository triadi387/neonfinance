<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Aplikasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #e6f0fa 0%, #b8d1e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 30, 60, 0.25);
            overflow: hidden;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Header dengan ilustrasi kreatif */
        .creative-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px 20px 60px;
            position: relative;
            overflow: hidden;
        }

        /* Background pattern */
        .creative-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }

        /* Ilustrasi uang dan perbaikan 3D */
        .repair-illustration {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            perspective: 1000px;
        }

        /* Uang dengan efek 3D */
        .money-3d {
            position: relative;
            width: 100px;
            height: 120px;
            background: linear-gradient(145deg, #4cd964, #34a853);
            border-radius: 20px 20px 15px 15px;
            transform: rotateY(-15deg) rotateX(5deg);
            box-shadow: -10px 10px 20px rgba(0,0,0,0.2), 
                        inset -2px -2px 10px rgba(0,0,0,0.1),
                        inset 2px 2px 10px rgba(255,255,255,0.5);
            animation: floatMoney 4s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffd966;
        }

        .money-3d::before {
            content: '$';
            font-size: 40px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .money-3d::after {
            content: '💰';
            font-size: 30px;
            position: absolute;
            bottom: 10px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .money-3d:nth-child(2) {
            background: linear-gradient(145deg, #ffcc00, #ffb347);
            transform: rotateY(0deg) rotateX(5deg) translateY(-10px);
            width: 120px;
            height: 140px;
            animation-delay: 0.5s;
            z-index: 20;
        }

        .money-3d:nth-child(2)::before {
            content: 'IDR';
            font-size: 24px;
            color: #1e3c72;
        }

        .money-3d:nth-child(2)::after {
            content: '💵';
        }

        .money-3d:nth-child(3) {
            background: linear-gradient(145deg, #50c878, #2e8b57);
            transform: rotateY(15deg) rotateX(5deg);
            animation-delay: 1s;
        }

        .money-3d:nth-child(3)::before {
            content: '€';
        }

        .money-3d:nth-child(3)::after {
            content: '💶';
        }

        /* Tools perbaikan */
        .tools-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .tool-item {
            position: absolute;
            font-size: 35px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
            animation: toolFloat 3s ease-in-out infinite;
        }

        .tool-item:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
        .tool-item:nth-child(2) { top: 60%; right: 20%; animation-delay: 0.5s; }
        .tool-item:nth-child(3) { bottom: 20%; left: 25%; animation-delay: 1s; }
        .tool-item:nth-child(4) { top: 30%; right: 25%; animation-delay: 1.5s; }
        .tool-item:nth-child(5) { bottom: 30%; right: 35%; animation-delay: 2s; }

        @keyframes toolFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Uang bertebaran */
        .floating-coins {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .coin {
            position: absolute;
            font-size: 24px;
            animation: coinFloat 6s linear infinite;
            opacity: 0.3;
        }

        .coin:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .coin:nth-child(2) { top: 70%; left: 80%; animation-delay: 2s; }
        .coin:nth-child(3) { top: 40%; left: 90%; animation-delay: 4s; }
        .coin:nth-child(4) { top: 80%; left: 20%; animation-delay: 1s; }
        .coin:nth-child(5) { top: 20%; left: 70%; animation-delay: 3s; }
        .coin:nth-child(6) { top: 50%; left: 40%; animation-delay: 5s; }

        @keyframes coinFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-50px) rotate(180deg);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes floatMoney {
            0%, 100% {
                transform: rotateY(-15deg) rotateX(5deg) translateY(0);
            }
            50% {
                transform: rotateY(-10deg) rotateX(8deg) translateY(-10px);
            }
        }

        /* Content area */
        .content {
            padding: 50px 40px;
            text-align: center;
            background: white;
            position: relative;
        }

        /* Badge maintenance */
        .badge {
            display: inline-block;
            background: #1e3c72;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.2);
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 20px;
            line-height: 1.2;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #4cd964, #ffcc00, #ff6b6b);
            border-radius: 2px;
        }

        .sub-text {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 35px;
            line-height: 1.7;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            background: #f8fafd;
            padding: 20px 25px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        /* Stats cards */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(145deg, #ffffff, #f5f9ff);
            padding: 20px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -8px rgba(30, 60, 114, 0.1);
            min-width: 130px;
            border: 1px solid rgba(30, 60, 114, 0.1);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1e3c72;
        }

        .stat-label {
            font-size: 14px;
            color: #718096;
            margin-top: 5px;
        }

        /* Progress section */
        .progress-section {
            background: #f0f7ff;
            padding: 25px;
            border-radius: 25px;
            margin: 30px 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #2d3748;
            font-weight: 500;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #d0e0f0;
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(120deg, #4cd964, #ffcc00);
            border-radius: 20px;
            position: relative;
            animation: progressPulse 2s ease-in-out infinite;
        }

        @keyframes progressPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Team working */
        .team-working {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 30px 0;
            padding: 20px;
            background: #fff9e6;
            border-radius: 50px;
        }

        .team-avatar {
            width: 45px;
            height: 45px;
            background: #1e3c72;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            border: 2px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .team-text {
            color: #2d3748;
            font-weight: 500;
        }

        /* Contact section */
        .contact-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #cbd5e0;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e3c72;
            text-decoration: none;
            padding: 10px 20px;
            background: #f0f7ff;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: #1e3c72;
            color: white;
            transform: translateY(-3px);
        }

        .contact-item:hover .contact-icon {
            color: white;
        }

        .contact-icon {
            font-size: 22px;
            color: #1e3c72;
            transition: all 0.3s ease;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            
            .sub-text {
                font-size: 16px;
                padding: 15px;
            }
            
            .money-3d {
                width: 70px;
                height: 90px;
            }
            
            .money-3d:nth-child(2) {
                width: 90px;
                height: 110px;
            }
            
            .tool-item {
                font-size: 25px;
            }
            
            .stat-card {
                min-width: 100px;
                padding: 15px;
            }
            
            .stat-value {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="creative-header">
            <!-- Ilustrasi 3D Uang dan Perbaikan -->
            <div class="repair-illustration">
                <div class="money-3d"></div>
                <div class="money-3d"></div>
                <div class="money-3d"></div>
            </div>
            
            <!-- Tools perbaikan -->
            <div class="tools-container">
                <span class="tool-item">🔧</span>
                <span class="tool-item">⚙️</span>
                <span class="tool-item">🔨</span>
                <span class="tool-item">🛠️</span>
                <span class="tool-item">🔩</span>
            </div>
            
            <!-- Uang bertebaran -->
            <div class="floating-coins">
                <span class="coin">💰</span>
                <span class="coin">💵</span>
                <span class="coin">💶</span>
                <span class="coin">💷</span>
                <span class="coin">💴</span>
                <span class="coin">🪙</span>
            </div>
            
            <!-- Efek sinar -->
            <div style="position: absolute; bottom: -30px; left: 0; width: 100%; height: 60px; background: linear-gradient(to top, white, transparent);"></div>
        </div>
        
        <div class="content">
            <!-- Badge -->
            <div class="badge">
                🔧⚙️ MAINTENANCE MODE ⚙️🔧
            </div>
            
            <!-- Teks besar -->
            <h2>Aplikasi Sedang Dalam Pemeliharaan</h2>
            
            <!-- Teks kecil dengan background -->
            <div class="sub-text">
                Sedang ada pemeliharaan sistem. Kamu bisa kembali menggunakan aplikasi setelah pemeliharaan selesai.
            </div>
            
            
            <!-- Progress bar kreatif -->
            <div class="progress-section">
                <div class="progress-info">
                    <h4>Memperbaiki sistem keuangan 🔧💰</h4>
                    <span>30%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #71809; font-size: 13px;">
                    <span>⚙️ Validasi data</span>
                    <span>🔨 Optimasi</span>
                    <span>💰 Update</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
